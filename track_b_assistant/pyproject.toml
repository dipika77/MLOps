[project]
name = "acme-assistant-mlops"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "evidently>=0.7.23",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
# `app` is a plain top-level package (no src/ layout, no install step) - make sure
# pytest puts the project root on sys.path regardless of where/how it's invoked.
pythonpath = ["."]
